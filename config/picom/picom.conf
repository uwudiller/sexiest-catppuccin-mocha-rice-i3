# Animations - FAST
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 3;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.5;

# Window settings
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = true;
backend = "glx";
